# ---------------------------------------------------------------------------
# Map view configuration (home page -> "Map" tab)
#
# Add one entry under `trips:` per trip. Nothing else needs to change.
#
#   trip:    file name of the trip in _trips/, without ".md"
#            (e.g. 07-varkala-ashtamudi-valparai). Used for the title/link.
#   color:   colour of the routes and pins for this trip (any CSS colour)
#   hidden:  true to keep the entry in this file but not show it on the map
#   routes:  one or more road segments. Each has a name and `waypoints`,
#            a list of [latitude, longitude] pairs in driving order.
#              snap: true   -> the line follows real roads (uses the public
#                              OSRM demo server, falls back to a straight
#                              line if it is unreachable)
#              snap: false  -> straight lines between waypoints; use this for
#                              flights, ferries or when you list dense points
#              dashed: true -> draw the segment dashed (good for flights)
#              color:       optional, overrides the trip colour for a segment
#   pins:    places visited
#              name, coords: [lat, lng]
#              type:  stay | food | sight | stop | start  (picks the icon)
#              day:   optional, shown in the popup
#              note:  optional, one line shown in the popup
#
# Tip: to get coordinates, right-click a place in Google Maps and click the
# numbers at the top of the menu. Coordinates below are approximate.
# ---------------------------------------------------------------------------

settings:
  center: [20.5, 78.9]   # initial view when the map opens (India)
  zoom: 5
  # Tiles come from OpenStreetMap. Swap the URL for another provider if needed.
  tile_url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
  tile_attribution: "&copy; OpenStreetMap contributors"

